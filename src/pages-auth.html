<script>
(function (global) {
  'use strict';

  var boot = global.BOOTSTRAP || {};

  /* =========================================================
   * Public entry
   * =======================================================*/

  function render(b) {
    boot = b || boot;
    var mode     = String(boot.authAction || 'login').toLowerCase();
    var token    = String(boot.authToken || '');
    var redirect = String(boot.authRedirect || '?');

    switch (mode) {
      case 'register': return renderRegister(redirect);
      case 'verify':   return renderVerify(token);
      case 'reset':    return renderReset(token);
      case 'forgot':   return renderForgot();
      default:         return renderLogin(redirect);
    }
  }

  /* =========================================================
   * URLs and shared bits
   * =======================================================*/

  function loginUrl(redirect) {
    return '?auth=login&redirect=' + encodeURIComponent(redirect || '?');
  }
  function registerUrl(redirect) {
    return '?auth=register&redirect=' + encodeURIComponent(redirect || '?');
  }
  function forgotUrl() {
    return '?auth=forgot';
  }

  function card(inner) {
    return '<div class="card auth-card">' + inner + '</div>';
  }

  function errBlock(id) {
    return '<p class="form-error" id="' + id + '" hidden></p>';
  }

  function successBlock(title, message, href, linkText) {
    return card(
      '<h2>' + global.H.escapeHtml(title) + '</h2>' +
      '<p>' + global.H.escapeHtml(message) + '</p>' +
      '<p><a class="btn-primary" href="' + global.H.escapeHtml(href) + '">' +
        global.H.escapeHtml(linkText) + '</a></p>'
    );
  }

  function showError(id, msg) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg;
    el.hidden = false;
  }

  function stripErr(msg) {
    return String(msg || '').replace(/^Error:\s*/, '');
  }

  /* =========================================================
   * Login
   * =======================================================*/

  function renderLogin(redirect) {
    var html = card(
      '<h2>Log in</h2>' +
      '<form id="login-form">' +
        '<label>Email <input name="email" type="email" autocomplete="username" required></label>' +
        '<label>Password <input name="password" type="password" autocomplete="current-password" required></label>' +
        errBlock('login-error') +
        '<div class="modal-actions">' +
          '<button type="submit" class="btn-primary">Log in</button>' +
        '</div>' +
      '</form>' +
      '<p class="auth-links">' +
        'No account? <a href="' + registerUrl(redirect) + '">Create one</a>' +
        ' &nbsp;·&nbsp; ' +
        'Forgot password? <a href="' + forgotUrl() + '">Reset</a>' +
      '</p>' +
      '<p class="back-to-hub"><a href="?">← Back to Hub</a></p>'
    );

    global.H.setMain(html);
    global.H.setStatus('Log in');

    document.getElementById('login-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var form = ev.target;
      var email = String(form.elements.email.value || '').trim();
      var password = String(form.elements.password.value || '');
      if (!email || !password) return;

      var submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Logging in…';

      global.api.auth('authLogin', { email: email, password: password })
        .then(function (res) {
          if (!res || !res.ok) {
            var code = res && res.error ? res.error : 'UNKNOWN';
            if (code === 'EMAIL_NOT_VERIFIED') {
              showError('login-error',
                'Your email is not verified. Check your inbox for the verification link.');
            } else {
              showError('login-error', 'Invalid email or password.');
            }
            submit.disabled = false;
            submit.textContent = 'Log in';
            return;
          }
          global.api.setSession(res.sessionToken, res.expiresAt, res.user);
          finishAndRedirect(redirect);
        })
        .catch(function (err) {
          showError('login-error', stripErr(err.message));
          submit.disabled = false;
          submit.textContent = 'Log in';
        });
    });
  }

  /* =========================================================
   * Forgot password (request a reset email)
   * =======================================================*/

  function renderForgot() {
    var html = card(
      '<h2>Reset password</h2>' +
      '<p class="muted">Enter your email and we will send a reset link if the account exists.</p>' +
      '<form id="forgot-form">' +
        '<label>Email <input name="email" type="email" autocomplete="username" required></label>' +
        errBlock('forgot-error') +
        '<p class="muted" id="forgot-success" hidden></p>' +
        '<div class="modal-actions">' +
          '<button type="submit" class="btn-primary">Send reset link</button>' +
        '</div>' +
      '</form>' +
      '<p class="auth-links">Remembered it? <a href="' + loginUrl('?') + '">Back to log in</a></p>' +
      '<p class="back-to-hub"><a href="?">← Back to Hub</a></p>'
    );

    global.H.setMain(html);
    global.H.setStatus('Reset password');

    document.getElementById('forgot-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var form = ev.target;
      var email = String(form.elements.email.value || '').trim();
      if (!email) return;

      var submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Sending…';

      global.api.auth('authRequestPasswordReset', { email: email }).then(function () {
        var s = document.getElementById('forgot-success');
        s.hidden = false;
        s.textContent = 'If an eligible account exists, a reset email will be sent.';
        submit.disabled = false;
        submit.textContent = 'Send reset link';
      }).catch(function (err) {
        showError('forgot-error', stripErr(err.message));
        submit.disabled = false;
        submit.textContent = 'Send reset link';
      });
    });
  }

  /* =========================================================
   * Register
   * =======================================================*/

  function renderRegister(redirect) {
    var html = card(
      '<h2>Create account</h2>' +
      '<form id="register-form">' +
        '<label>Display name <input name="displayName" type="text" maxlength="40" required></label>' +
        '<label>Email <input name="email" type="email" autocomplete="username" required></label>' +
        '<label>Password <input name="password" type="password" autocomplete="new-password" required minlength="12"></label>' +
        '<label>Confirm password <input name="confirm" type="password" autocomplete="new-password" required minlength="12"></label>' +
        errBlock('register-error') +
        errBlock('register-success') +
        '<div class="modal-actions">' +
          '<button type="submit" class="btn-primary">Create account</button>' +
        '</div>' +
      '</form>' +
      '<p class="auth-links">Already have an account? <a href="' + loginUrl(redirect) + '">Log in</a></p>' +
      '<p class="back-to-hub"><a href="?">← Back to Hub</a></p>'
    );

    global.H.setMain(html);
    global.H.setStatus('Register');

    document.getElementById('register-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var form = ev.target;
      var displayName = String(form.elements.displayName.value || '').trim();
      var email = String(form.elements.email.value || '').trim();
      var password = String(form.elements.password.value || '');
      var confirm = String(form.elements.confirm.value || '');

      if (password !== confirm) {
        return showError('register-error', 'Passwords do not match.');
      }
      if (password.length < 12) {
        return showError('register-error', 'Password must be at least 12 characters.');
      }

      var submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Creating…';

      global.api.auth('authRegisterAccount', {
        email: email, password: password, displayName: displayName
      }).then(function (res) {
        if (res && res.ok) {
          var s = document.getElementById('register-success');
          s.hidden = false;
          s.textContent = 'If this address can be registered, check your email for next steps.';
          submit.textContent = 'Account requested';
        } else {
          showError('register-error', (res && res.error) || 'UNKNOWN');
          submit.disabled = false;
          submit.textContent = 'Create account';
        }
      }).catch(function (err) {
        showError('register-error', stripErr(err.message));
        submit.disabled = false;
        submit.textContent = 'Create account';
      });
    });
  }

  /* =========================================================
   * Verify
   * =======================================================*/

  function renderVerify(token) {
    if (!token) {
      global.H.setMain(card(
        '<h2>Verification link is incomplete.</h2>' +
        '<p>The token is missing from the URL. Request a new email from the login page.</p>' +
        '<p><a class="btn-primary" href="' + loginUrl('?') + '">Go to login</a></p>'
      ));
      return;
    }

    try {
      global.history.replaceState({}, '', '?auth=verify');
    } catch (e) { /* ignore */ }

    global.H.setMain(global.H.spinner('Verifying your email…'));

    global.api.auth('authVerifyEmail', { token: token }).then(function (res) {
      if (res && res.ok) {
        global.H.setMain(successBlock(
          'Email verified',
          'Your account is active. You can now log in.',
          loginUrl('?'),
          'Continue to log in →'
        ));
        global.H.setStatus('Verified');
      } else {
        global.H.setMain(card(
          '<h2>Verification failed</h2>' +
          '<p>This verification link is invalid, expired, or already used.</p>' +
          '<p><a class="btn-primary" href="' + loginUrl('?') + '">Go to login</a></p>'
        ));
      }
    }).catch(function (err) {
      global.H.setMain(global.H.errorBlock('Verification error: ' + stripErr(err.message)));
    });
  }

  /* =========================================================
   * Reset password (consume token)
   * =======================================================*/

  function renderReset(token) {
    if (!token) {
      global.H.setMain(card(
        '<h2>Reset link is incomplete.</h2>' +
        '<p>The token is missing from the URL. Request a new reset email from the login page.</p>' +
        '<p><a class="btn-primary" href="' + loginUrl('?') + '">Go to login</a></p>'
      ));
      return;
    }

    try {
      global.history.replaceState({}, '', '?auth=reset');
    } catch (e) { /* ignore */ }

    global.H.setMain(card(
      '<h2>Choose a new password</h2>' +
      '<form id="reset-form">' +
        '<label>New password <input name="password" type="password" autocomplete="new-password" required minlength="12"></label>' +
        '<label>Confirm password <input name="confirm" type="password" autocomplete="new-password" required minlength="12"></label>' +
        errBlock('reset-error') +
        '<div class="modal-actions">' +
          '<button type="submit" class="btn-primary">Reset password</button>' +
        '</div>' +
      '</form>' +
      '<p class="back-to-hub"><a href="' + loginUrl('?') + '">← Back to login</a></p>'
    ));

    document.getElementById('reset-form').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var form = ev.target;
      var password = String(form.elements.password.value || '');
      var confirm = String(form.elements.confirm.value || '');
      if (password !== confirm) {
        return showError('reset-error', 'Passwords do not match.');
      }
      if (password.length < 12) {
        return showError('reset-error', 'Password must be at least 12 characters.');
      }

      var submit = form.querySelector('button[type="submit"]');
      submit.disabled = true;
      submit.textContent = 'Resetting…';

      global.api.auth('authResetPassword', { token: token, password: password })
        .then(function (res) {
          if (res && res.ok) {
            global.H.setMain(successBlock(
              'Password updated',
              'Your password has been reset. Any existing sessions have been signed out.',
              loginUrl('?'),
              'Continue to log in →'
            ));
          } else {
            showError('reset-error',
              'This reset link is invalid, expired, or already used.');
            submit.disabled = false;
            submit.textContent = 'Reset password';
          }
        })
        .catch(function (err) {
          showError('reset-error', stripErr(err.message));
          submit.disabled = false;
          submit.textContent = 'Reset password';
        });
    });
  }

  /* =========================================================
   * Redirect helper — best-effort navigate + visible fallback
   * =======================================================*/

  function finishAndRedirect(redirect) {
    var target = String(redirect || '?');
    global.H.setMain(
      '<div class="card auth-card">' +
        '<h2>Logged in</h2>' +
        '<p>Continuing…</p>' +
        '<p><a class="btn-primary" href="' + global.H.escapeHtml(target) +
          '">Continue →</a></p>' +
      '</div>'
    );
    global.H.navigateTop(target);
  }

  global.Pages = global.Pages || {};
  global.Pages.Auth = { render: render };
})(window);
</script>
