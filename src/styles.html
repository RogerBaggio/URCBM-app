<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #242836;
    --text: #e6e8ee;
    --text-dim: #9aa0b0;
    --accent: #6c8cff;
    --accent-2: #8ea4ff;
    --border: #2c3040;
    --danger: #ff6b6b;
    --radius: 10px;
    --max-width: 1100px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100%;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #app-header {
    padding: 18px 16px 12px;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .brand:hover { text-decoration: none; }
  .brand-title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  #app-main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 8px 16px 96px;
  }

  .loading {
    color: var(--text-dim);
    font-style: italic;
  }

  #app-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  #refresh-btn {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #refresh-btn:hover { background: var(--accent-2); }
  #refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { margin-top: 0; }

  .card.error {
    border-color: var(--danger);
    color: var(--danger);
  }

  .muted { color: var(--text-dim); }
  code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.9em;
  }

  .hub-actions { margin: 0 0 16px; }
  .hub-section { margin-bottom: 24px; }
  .hub-section h2 {
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin: 0 0 8px;
  }

  .tournament-list {
    list-style: none;
    padding: 0;
    margin: 0;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  
  .tournament-row {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tournament-row:last-child { border-bottom: 0; }
  .tournament-row a { font-weight: 600; }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .btn-primary:hover { background: var(--accent-2); }

  dialog.modal {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    min-width: 280px;
    max-width: 400px;
  }
  
  dialog.modal::backdrop { background: rgba(0,0,0,0.5); }
  dialog.modal h3 { margin-top: 0; }
  dialog.modal label {
    display: block;
    margin-bottom: 10px;
    font-size: 0.9rem;
  }
  dialog.modal input {
    display: block;
    width: 100%;
    margin-top: 4px;
    padding: 8px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
  }
  
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 12px;
  }
  
  .form-error {
    color: var(--danger);
    font-size: 0.85rem;
    margin: 4px 0;
  }

  /* --- Invite page ------------------------------------------ */
.invite-header h2 { margin-bottom: 4px; }

.badge {
  display: inline-block;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 0.75rem;
  color: var(--text-dim);
}

.invite-message { font-size: 1rem; }

.invite-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.9rem;
  cursor: pointer;
}
.btn-secondary:hover { background: var(--border); }

.btn-danger {
  background: var(--danger);
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 8px 14px;
  font-size: 0.9rem;
  cursor: pointer;
}

.owner-tools h3 { margin: 0 0 10px; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); }

.nickname-label {
  display: flex;
  flex-direction: column;
  font-size: 0.85rem;
  color: var(--text-dim);
  flex: 1 1 200px;
}
.nickname-label input {
  margin-top: 4px;
  padding: 8px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
}

.back-to-hub { margin-top: 24px; }

/* --- Dialogs --------------------------------------------- */
dialog.modal hr.modal-sep {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 16px 0;
}
.danger-actions { justify-content: space-between; }
.danger-actions .btn-primary { flex: 0 0 auto; }

.players-list {
  max-height: 320px;
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px;
  background: var(--surface-2);
}
.player-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  padding: 6px;
  border-radius: 4px;
  cursor: pointer;
}
.player-row:hover { background: var(--surface); }
.player-name { font-weight: 600; }
.player-email { font-size: 0.75rem; }

dialog.modal input[readonly] {
  background: var(--surface-2);
  color: var(--text-dim);
}

.invite-actions a.btn-primary[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}

/* --- Modal close button (red X, top-right) --------------- */
dialog.modal { position: relative; }

.modal-x {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--danger);
  color: #fff;
  border: 0;
  font-size: 1.1rem;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.modal-x:hover { filter: brightness(1.1); }

/* --- Confirm dialog -------------------------------------- */
.confirm-modal h3 { padding-right: 28px; }
.confirm-modal p  { color: var(--text-dim); }

/* --- Players dialog -------------------------------------- */
.player-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 6px;
  padding: 6px;
  border-radius: 4px;
}
.player-main {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.player-remove {
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--danger);
  border-radius: 6px;
  width: 28px;
  height: 28px;
  cursor: pointer;
  font-weight: 700;
}
.player-remove:hover { background: var(--danger); color: #fff; }

/* --- Auth pages ------------------------------------------ */
.auth-card { max-width: 420px; margin: 24px auto; }
.auth-links {
  margin-top: 16px;
  font-size: 0.85rem;
  color: var(--text-dim);
}
.auth-links a { color: var(--accent-2); }
</style>
