<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-2: #242836;
    --text: #e6e8ee;
    --text-dim: #9aa0b0;
    --accent: #6c8cff;
    --accent-2: #8ea4ff;
    --border: #2c3040;
    --danger: #ff6b6b;
    --radius: 10px;
    --max-width: 1100px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
    min-height: 100%;
  }

  a { color: var(--accent-2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  #app-header {
    padding: 18px 16px 12px;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }
  .brand:hover { text-decoration: none; }
  .brand-title {
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .brand-sub {
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  #app-main {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 8px 16px 96px;
  }

  .loading {
    color: var(--text-dim);
    font-style: italic;
  }

  #app-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  #refresh-btn {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  #refresh-btn:hover { background: var(--accent-2); }
  #refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card h2 { margin-top: 0; }

  .card.error {
    border-color: var(--danger);
    color: var(--danger);
  }

  .muted { color: var(--text-dim); }
  code {
    background: var(--surface-2);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 0.9em;
