<script>
(function (global) {
  'use strict';

  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function qs(sel, root) { return (root || document).querySelector(sel); }

  function setMain(html) {
    var main = qs('#app-main');
    main.innerHTML = '';
    if (typeof html === 'string') main.innerHTML = html;
    else if (html && html.nodeType) main.appendChild(html);
  }

  function setStatus(text) {
    qs('#poll-status').textContent = text || '';
  }

  function spinner(text) {
    return '<p class="loading">' + escapeHtml(text || 'Loading…') + '</p>';
  }

  function errorBlock(message) {
    return '<div class="card error">' +
      '<p>' + escapeHtml(message || 'Something went wrong.') + '</p>' +
      '</div>';
  }

  function formatDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso);
      return d.toLocaleString();
    } catch (e) { return String(iso); }
  }

  /* ---------------------------------------------------------
  * Confirmation dialog (replaces window.confirm)
  * Usage:
  *   H.confirm({ title, message, confirmLabel, danger })
  *     .then(() => { ... })
  *     .catch(() => {  cancelled  });
  * -------------------------------------------------------*/
  function confirmDialog(opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      var id = 'confirm-' + Date.now();
      var html =
        '<dialog id="' + id + '" class="modal confirm-modal">' +
          '<button type="button" class="modal-x" data-x aria-label="Cancel">×</button>' +
          '<h3>' + escapeHtml(opts.title || 'Are you sure?') + '</h3>' +
          '<p>' + escapeHtml(opts.message || '') + '</p>' +
          '<div class="modal-actions">' +
            '<button type="button" data-no>' + escapeHtml(opts.cancelLabel || 'Cancel') + '</button>' +
            '<button type="button" data-yes class="' +
              (opts.danger ? 'btn-danger' : 'btn-primary') + '">' +
              escapeHtml(opts.confirmLabel || 'Confirm') +
            '</button>' +
          '</div>' +
        '</dialog>';
      var wrap = document.createElement('div');
      wrap.innerHTML = html;
      document.body.appendChild(wrap);
      var dlg = wrap.firstChild;

      function close(ok) {
        dlg.close();
        wrap.remove();
        if (ok) resolve(true);
        else reject(new Error('cancelled'));
      }

      dlg.querySelector('[data-yes]').addEventListener('click', function () { close(true); });
      dlg.querySelector('[data-no]').addEventListener('click', function () { close(false); });
      dlg.querySelector('[data-x]').addEventListener('click', function () { close(false); });
      dlg.addEventListener('cancel', function (e) { e.preventDefault(); close(false); });

      dlg.showModal();
    });
  }

  /* ---------------------------------------------------------
  * Date helpers
  * -------------------------------------------------------*/
  function normalizeDateForInput(value) {
    if (!value) return '';
    var s = String(value).trim();
    // Already YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // ISO string → slice the date part
    if (/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0, 10);
    // Try Date parsing as a last resort
    var d = new Date(s);
    if (!isNaN(d.getTime())) {
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, '0');
      var day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }
    return '';
  }

  /* ---------------------------------------------------------
  * Navigation helper for Apps Script IFRAME mode
  * Always builds URLs from the deployed web app URL.
  * -------------------------------------------------------*/
  function navigateTop(path) {
    var bootstrap = global.BOOTSTRAP || {};
    var base = String(bootstrap.appUrl || '').replace(/\/+$/, '');

    if (!base) {
      console.error(
        'BOOTSTRAP.appUrl is missing; cannot navigate to the web app.'
      );

      if (global.H && typeof global.H.setStatus === 'function') {
        global.H.setStatus(
          'Navigation failed: app URL unavailable. Reload the app.'
        );
      }

      return false;
    }

    var suffix = String(path || '?');

    if (suffix.charAt(0) !== '?' && suffix.charAt(0) !== '#') {
      suffix = '?' + suffix;
    }

    var link = document.createElement('a');
    link.href = base + suffix;
    link.target = '_top';
    link.rel = 'noopener';
    link.style.display = 'none';

    document.body.appendChild(link);
    link.click();

    window.setTimeout(function () {
      if (link.parentNode) {
        link.parentNode.removeChild(link);
      }
    }, 100);

    return true;
  }

  function reloadTop() {
    var bootstrap = global.BOOTSTRAP || {};
    var path = '?';

    if (bootstrap.inviteToken) {
      path = '?invite=' + encodeURIComponent(bootstrap.inviteToken);
    } else if (bootstrap.tournamentId) {
      path = '?t=' + encodeURIComponent(bootstrap.tournamentId);
    }

    return navigateTop(path);
  }

  global.H = {
    escapeHtml: escapeHtml,
    qs: qs,
    setMain: setMain,
    setStatus: setStatus,
    spinner: spinner,
    errorBlock: errorBlock,
    formatDate: formatDate,
    confirmDialog: confirmDialog,
    navigateTop: navigateTop,
    reloadTop: reloadTop,
    normalizeDateForInput: normalizeDateForInput
  };
})(window);
</script>
