<script>
(function (global) {
  'use strict';

  var boot = global.BOOTSTRAP || { page: 'hub' };

  function render() {
    var pages = global.Pages || {};
    try {
      switch (boot.page) {
        case 'auth':
          if (pages.Auth) return pages.Auth.render(boot);
          break;
        case 'invite':
          if (pages.Invite) return pages.Invite.render(boot);
          break;
        case 'tournament':
          if (pages.Tournament) return pages.Tournament.render(boot);
          break;
        case 'error':
          if (pages.Error) return pages.Error.render(boot);
          break;
        default:
          if (pages.Hub) return pages.Hub.render(boot);
      }
      global.H.setMain(global.H.errorBlock('No renderer for page: ' + boot.page));
    } catch (e) {
      global.H.setMain(global.H.errorBlock(e.message || 'Render failed.'));
    }
  }

  function wireFooter() {
    var btn = global.H.qs('#refresh-btn');
    if (!btn) return;
    var lastClick = 0;
    btn.hidden = false;
    btn.addEventListener('click', function () {
      var now = Date.now();
      if (now - lastClick < 10000) return;
      lastClick = now;
      btn.disabled = true;
      setTimeout(function () { btn.disabled = false; }, 10000);
      global.H.setStatus('Refreshed at ' + new Date().toLocaleTimeString());
      if (global.App && typeof global.App.onRefresh === 'function') {
        global.App.onRefresh();
      }
    });
  }

  global.App = global.App || {};
  global.App.onRefresh = null;
  global.App.onSessionChange = null;

  global.addEventListener('urcbm:session-changed', function (ev) {
    if (global.App && typeof global.App.onSessionChange === 'function') {
      try { global.App.onSessionChange(ev.detail); } catch (e) { /* ignore */ }
    }
  });

  function boot_() {
    wireFooter();

    var restore = (global.api && typeof global.api.restoreSession === 'function')
      ? global.api.restoreSession()
      : Promise.resolve(null);

    restore.then(function () {
      render();
    }).catch(function () {
      render();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot_);
  } else {
    boot_();
  }
})(window);
</script>
