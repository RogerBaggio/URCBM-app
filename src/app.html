<script>
(function () {
  'use strict';

  var boot = window.BOOTSTRAP || { page: 'hub' };

  function render() {
    var main = document.getElementById('app-main');
    switch (boot.page) {
      case 'invite':
        main.innerHTML =
          '<div class="card">' +
            '<h2>Invite</h2>' +
            '<p class="muted">Decision: <code>' + escapeHtml(boot.decision || 'invalid') + '</code></p>' +
            (boot.tournament
              ? '<p>Tournament: <strong>' + escapeHtml(boot.tournament.name) + '</strong></p>'
              : '') +
          '</div>';
        break;

      case 'tournament':
        main.innerHTML =
          '<div class="card">' +
            '<h2>' + escapeHtml(boot.tournament.name) + '</h2>' +
            '<p class="muted">Game: ' + escapeHtml(boot.tournament.game) + '</p>' +
            '<p class="muted">State: ' + escapeHtml(boot.tournament.state) + '</p>' +
            '<p class="muted">Your role: ' + escapeHtml(boot.role) + '</p>' +
          '</div>';
        break;

      case 'not-found':
        main.innerHTML =
          '<div class="card"><h2>Not found</h2>' +
          '<p class="muted">That tournament does not exist or was removed.</p></div>';
        break;

      default: // hub
        main.innerHTML =
          '<div class="card"><h2>Hub</h2>' +
          '<p class="muted">Tournament list coming in Step 12.</p></div>';
    }
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  document.getElementById('refresh-btn').hidden = false;
  document.getElementById('refresh-btn').addEventListener('click', function () {
    this.disabled = true;
    var btn = this;
    setTimeout(function () { btn.disabled = false; }, 10000);
    // Real refresh logic arrives with the polling module.
    document.getElementById('poll-status').textContent = 'Refreshed at ' + new Date().toLocaleTimeString();
  });

  render();
  document.getElementById('poll-status').textContent = 'Ready';
})();
</script>
